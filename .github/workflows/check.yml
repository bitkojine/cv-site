name: check

on:
  push:
    branches:
      - main
      - codex/**
  workflow_dispatch:

jobs:
  check:
    runs-on: [self-hosted, cv-site, ephemeral]
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Validate required files exist
        run: |
          test -f index.html
          test -f briefs/index.html
          test -f briefs/_template.html

      - name: Basic HTML sanity check
        run: |
          grep -q "<!doctype html>" index.html
          grep -q "<main>" index.html
          grep -q "<h1>" briefs/b2b-saas-head-of-sales.html

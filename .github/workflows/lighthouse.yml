name: Lighthouse

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Lighthouse Audit (100 threshold)
        run: npm run audit:lighthouse:ci

      - name: Resolve artifact path
        if: always()
        id: lh_path
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f audit/lighthouse/latest-run.txt ]; then
            echo "path=audit/lighthouse" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "path=$(cat audit/lighthouse/latest-run.txt)" >> "$GITHUB_OUTPUT"

      - name: Upload Lighthouse Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-report-${{ github.run_id }}
          path: ${{ steps.lh_path.outputs.path }}
          if-no-files-found: warn

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: '0,30 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.fetch.outputs.changed }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Restore GitHub Activity Cache
        uses: actions/cache@v4
        with:
          path: .cache
          key: github-activity-${{ github.run_id }}
          restore-keys: |
            github-activity-

      - name: Install dependencies
        run: npm install

      - name: Fetch GitHub Activity
        id: fetch
        run: npm run fetch-activity
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Astro
        if: github.event_name != 'schedule' || steps.fetch.outputs.changed == 'true'
        run: npm run build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifact
        if: github.event_name != 'schedule' || steps.fetch.outputs.changed == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    if: github.event_name != 'schedule' || needs.build.outputs.changed == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

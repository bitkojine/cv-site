name: Site Availability Monitor

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check-site:
    runs-on: ubuntu-latest
    env:
      URL: https://robertasrudys.com
    steps:
      - name: Check edge availability
        id: edge
        shell: bash
        run: |
          set -euo pipefail

          headers="$(mktemp)"
          status="$(curl -sS -o /dev/null -D "$headers" -w "%{http_code}" --max-time 20 "$URL" || true)"
          server="$(grep -i '^server:' "$headers" | tail -n1 | cut -d' ' -f2- | tr -d '\r' || true)"
          ray="$(grep -i '^cf-ray:' "$headers" | tail -n1 | cut -d' ' -f2- | tr -d '\r' || true)"

          alert=false
          reason="site availability healthy"

          if [ -z "${status}" ] || [ "${status}" = "000" ]; then
            alert=true
            reason="site unavailable: request failed"
          elif [ "${status}" = "526" ]; then
            alert=true
            reason="site unavailable: Cloudflare 526 (invalid origin SSL certificate)"
          elif [ "${status}" -ge 500 ]; then
            alert=true
            reason="site unavailable: HTTP ${status}"
          fi

          {
            echo "alert=${alert}"
            echo "reason=${reason}"
            echo "status=${status}"
            echo "server=${server}"
            echo "cf_ray=${ray}"
          } >> "$GITHUB_OUTPUT"

          echo "Status: ${status}"
          echo "Server: ${server}"
          echo "CF-Ray: ${ray}"
          echo "Reason: ${reason}"

      - name: Open or update alert issue
        if: steps.edge.outputs.alert == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const title = 'Availability alert: robertasrudys.com';
            const body = [
              'Detected by `.github/workflows/site-availability-monitor.yml`.',
              '',
              `Reason: ${process.env.REASON}`,
              `HTTP status: ${process.env.STATUS}`,
              `Server: ${process.env.SERVER || '(none)'}`,
              `CF-Ray: ${process.env.CF_RAY || '(none)'}`,
              '',
              `Workflow run: https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            ].join('\n');

            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              creator: 'github-actions[bot]',
              per_page: 100,
            });

            const existing = issues.find((i) => i.title === title);
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['ops', 'availability'],
              });
            }
        env:
          REASON: ${{ steps.edge.outputs.reason }}
          STATUS: ${{ steps.edge.outputs.status }}
          SERVER: ${{ steps.edge.outputs.server }}
          CF_RAY: ${{ steps.edge.outputs.cf_ray }}

      - name: Send alert email
        if: steps.edge.outputs.alert == 'true' && secrets.ALERT_SMTP_SERVER != '' && secrets.ALERT_SMTP_USERNAME != '' && secrets.ALERT_SMTP_PASSWORD != '' && secrets.ALERT_EMAIL_TO != '' && secrets.ALERT_EMAIL_FROM != ''
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.ALERT_SMTP_SERVER }}
          server_port: ${{ secrets.ALERT_SMTP_PORT || '587' }}
          username: ${{ secrets.ALERT_SMTP_USERNAME }}
          password: ${{ secrets.ALERT_SMTP_PASSWORD }}
          secure: false
          subject: '[ALERT] robertasrudys.com availability'
          to: ${{ secrets.ALERT_EMAIL_TO }}
          from: ${{ secrets.ALERT_EMAIL_FROM }}
          body: |
            Availability monitor alert for robertasrudys.com

            Reason: ${{ steps.edge.outputs.reason }}
            HTTP status: ${{ steps.edge.outputs.status }}
            Server: ${{ steps.edge.outputs.server }}
            CF-Ray: ${{ steps.edge.outputs.cf_ray }}

            Workflow run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}

      - name: Fail workflow when alerting
        if: steps.edge.outputs.alert == 'true'
        run: |
          echo "Availability alert: ${{ steps.edge.outputs.reason }}"
          exit 1

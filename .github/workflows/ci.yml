name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  branch-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head commit
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Ensure PR branch includes latest base branch
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          BASE_REF="${{ github.base_ref }}"
          git fetch origin "${BASE_REF}" --depth=1
          BASE_TIP="$(git rev-parse "origin/${BASE_REF}")"
          HEAD_SHA="$(git rev-parse HEAD)"

          if git merge-base --is-ancestor "${BASE_TIP}" "${HEAD_SHA}"; then
            echo "Branch is up to date with ${BASE_REF}."
            exit 0
          fi

          echo "PR branch is behind ${BASE_REF}. Rebase/merge ${BASE_REF} and push again."
          exit 1

      - name: Skip branch sync on push
        if: github.event_name != 'pull_request'
        run: echo "Branch sync check is only required for pull_request events."

  check:
    needs: [branch-sync]
    if: github.event_name != 'pull_request' || needs.branch-sync.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Lint Workflows
        run: npm run lint:workflows

      - name: Check Format
        run: npx prettier --check .

      - name: Unit Tests
        run: npm run test:unit

      - name: Build
        run: npm run build

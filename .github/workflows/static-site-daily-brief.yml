name: Static Site Daily Brief

on:
  schedule:
    - cron: '30 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  daily-brief:
    runs-on: ubuntu-latest
    env:
      URL: https://robertasrudys.com
      DOMAIN: robertasrudys.com
      ALERT_DAYS: '21'
      CRITICAL_DAYS: '7'
      ORIGIN_IPS: '185.199.108.153 185.199.109.153 185.199.110.153 185.199.111.153'
      ENFORCE_ORIGIN_VALIDATION: 'false'
      MAX_URL_CHECKS: '250'
      EXPECTED_NS_1: chip.ns.cloudflare.com.
      EXPECTED_NS_2: rosalie.ns.cloudflare.com.
    steps:
      - name: Collect daily website brief
        id: brief
        shell: bash
        run: |
          set -euo pipefail

          ALERT_DAYS="${ALERT_DAYS:-21}"
          CRITICAL_DAYS="${CRITICAL_DAYS:-7}"
          ENFORCE_ORIGIN_VALIDATION="${ENFORCE_ORIGIN_VALIDATION:-false}"
          MAX_URL_CHECKS="${MAX_URL_CHECKS:-250}"

          now_utc="$(date -u +'%Y-%m-%d %H:%M:%S UTC')"
          headers_file="$(mktemp)"
          report_file="$(mktemp)"
          html_file="$(mktemp)"

          classify_state() {
            local days_left="$1"
            local alert_days="$2"
            local critical_days="$3"

            if [ -z "${days_left}" ]; then
              echo "error"
            elif [ "${days_left}" -lt 0 ]; then
              echo "expired"
            elif [ "${days_left}" -le "${critical_days}" ]; then
              echo "critical"
            elif [ "${days_left}" -le "${alert_days}" ]; then
              echo "warning"
            else
              echo "healthy"
            fi
          }

          cert_days_left() {
            local connect_target="$1"
            local sni="$2"
            local now_epoch
            local end_date
            local cert_epoch
            local days_left

            now_epoch="$(date -u +%s)"
            end_date="$(echo | openssl s_client -servername "${sni}" -connect "${connect_target}" 2>/dev/null | openssl x509 -noout -enddate | cut -d= -f2 || true)"
            if [ -z "${end_date}" ]; then
              echo "|"
              return 0
            fi

            cert_epoch="$(date -u -d "${end_date}" +%s)"
            days_left="$(( (cert_epoch - now_epoch) / 86400 ))"
            echo "${end_date}|${days_left}"
          }

          edge_metrics="$(curl -sS -o /dev/null -D "${headers_file}" --max-time 20 -w 'status=%{http_code}\nttfb=%{time_starttransfer}\ntotal=%{time_total}\n' "${URL}" || true)"
          edge_status="$(echo "${edge_metrics}" | awk -F= '/^status=/{print $2}')"
          edge_ttfb="$(echo "${edge_metrics}" | awk -F= '/^ttfb=/{print $2}')"
          edge_total="$(echo "${edge_metrics}" | awk -F= '/^total=/{print $2}')"
          edge_server="$(grep -i '^server:' "${headers_file}" | tail -n1 | cut -d' ' -f2- | tr -d '\r' || true)"
          edge_cf_ray="$(grep -i '^cf-ray:' "${headers_file}" | tail -n1 | cut -d' ' -f2- | tr -d '\r' || true)"

          curl -fsSL --max-time 20 "${URL}" > "${html_file}" || true

          edge_cert_data="$(cert_days_left "${DOMAIN}:443" "${DOMAIN}")"
          edge_not_after="$(echo "${edge_cert_data}" | cut -d'|' -f1)"
          edge_days_left="$(echo "${edge_cert_data}" | cut -d'|' -f2)"
          edge_state="$(classify_state "${edge_days_left}" "${ALERT_DAYS}" "${CRITICAL_DAYS}")"

          origin_min_days_left=999999
          origin_min_not_after=""
          origin_state="healthy"
          origin_details=""
          origin_has_error=0
          for ip in ${ORIGIN_IPS}; do
            origin_data="$(cert_days_left "${ip}:443" "${DOMAIN}")"
            origin_not_after="$(echo "${origin_data}" | cut -d'|' -f1)"
            origin_days_left="$(echo "${origin_data}" | cut -d'|' -f2)"
            if [ -z "${origin_not_after}" ] || [ -z "${origin_days_left}" ]; then
              origin_has_error=1
              origin_details="${origin_details}\n- ${ip}: failed to read certificate"
              continue
            fi
            origin_details="${origin_details}\n- ${ip}: ${origin_not_after} (${origin_days_left} days)"
            if [ "${origin_days_left}" -lt "${origin_min_days_left}" ]; then
              origin_min_days_left="${origin_days_left}"
              origin_min_not_after="${origin_not_after}"
            fi
          done
          if [ "${origin_has_error}" -eq 1 ] && [ "${origin_min_days_left}" -eq 999999 ]; then
            origin_state="error"
            origin_min_days_left=""
          else
            origin_state="$(classify_state "${origin_min_days_left}" "${ALERT_DAYS}" "${CRITICAL_DAYS}")"
          fi

          dns_ns="$(dig +short "${DOMAIN}" NS | tr '\n' ' ' || true)"
          dns_a="$(dig +short "${DOMAIN}" A | tr '\n' ' ' || true)"
          dns_aaaa="$(dig +short "${DOMAIN}" AAAA | tr '\n' ' ' || true)"
          dns_www_cname="$(dig +short "www.${DOMAIN}" CNAME | tr '\n' ' ' || true)"
          dns_caa="$(dig +short "${DOMAIN}" CAA | tr '\n' ' ' || true)"

          ns_ok=true
          echo "${dns_ns}" | grep -q "${EXPECTED_NS_1}" || ns_ok=false
          echo "${dns_ns}" | grep -q "${EXPECTED_NS_2}" || ns_ok=false

          hsts="$(grep -i '^strict-transport-security:' "${headers_file}" | cut -d' ' -f2- | tr -d '\r' || true)"
          csp_header="$(grep -i '^content-security-policy:' "${headers_file}" | cut -d' ' -f2- | tr -d '\r' || true)"
          xfo="$(grep -i '^x-frame-options:' "${headers_file}" | cut -d' ' -f2- | tr -d '\r' || true)"
          xcto="$(grep -i '^x-content-type-options:' "${headers_file}" | cut -d' ' -f2- | tr -d '\r' || true)"
          refpol_header="$(grep -i '^referrer-policy:' "${headers_file}" | cut -d' ' -f2- | tr -d '\r' || true)"

          csp_meta="$(grep -Eio '<meta[^>]+http-equiv=["'"'"']Content-Security-Policy["'"'"'][^>]*>' "${html_file}" || true)"
          refpol_meta="$(grep -Eio '<meta[^>]+name=["'"'"']referrer["'"'"'][^>]*>' "${html_file}" || true)"

          csp_ok=false
          [ -n "${csp_header}" ] && csp_ok=true
          [ -n "${csp_meta}" ] && csp_ok=true

          frame_protection_ok=false
          [ -n "${xfo}" ] && frame_protection_ok=true
          if [ -n "${csp_header}" ] && echo "${csp_header}" | grep -qi "frame-ancestors"; then frame_protection_ok=true; fi
          if [ -n "${csp_meta}" ] && echo "${csp_meta}" | grep -qi "frame-ancestors"; then frame_protection_ok=true; fi

          refpol_ok=false
          [ -n "${refpol_header}" ] && refpol_ok=true
          [ -n "${refpol_meta}" ] && refpol_ok=true

          security_actions=""
          [ -z "${hsts}" ] && security_actions="${security_actions}\n- Add HSTS at Cloudflare edge (response header)."
          [ "${csp_ok}" != "true" ] && security_actions="${security_actions}\n- Add CSP (edge header preferred; meta fallback currently checked)."
          [ "${frame_protection_ok}" != "true" ] && security_actions="${security_actions}\n- Add frame protection (X-Frame-Options or CSP frame-ancestors)."
          [ -z "${xcto}" ] && security_actions="${security_actions}\n- Add X-Content-Type-Options: nosniff at Cloudflare edge."
          [ "${refpol_ok}" != "true" ] && security_actions="${security_actions}\n- Add Referrer-Policy header (meta fallback currently checked)."

          robots_status="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 15 "${URL}/robots.txt" || true)"
          sitemap_index_status="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 15 "${URL}/sitemap-index.xml" || true)"

          sitemap_tmp="$(mktemp)"
          sitemap_urls_tmp="$(mktemp)"
          checked_urls=0
          bad_urls=0
          bad_details=""

          if curl -fsSL --max-time 20 "${URL}/sitemap-index.xml" > "${sitemap_tmp}"; then
            grep -oE '<loc>[^<]+' "${sitemap_tmp}" | sed 's/<loc>//' > "${sitemap_urls_tmp}" || true
            while IFS= read -r sitemap_url; do
              [ -z "${sitemap_url}" ] && continue
              page_tmp="$(mktemp)"
              if curl -fsSL --max-time 20 "${sitemap_url}" > "${page_tmp}"; then
                grep -oE '<loc>[^<]+' "${page_tmp}" | sed 's/<loc>//'
              fi
              rm -f "${page_tmp}"
            done < "${sitemap_urls_tmp}" | awk '!seen[$0]++' | head -n "${MAX_URL_CHECKS}" > "${sitemap_urls_tmp}.all"

            while IFS= read -r page_url; do
              [ -z "${page_url}" ] && continue
              checked_urls=$((checked_urls + 1))
              code="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 15 "${page_url}" || echo 000)"
              if ! echo "${code}" | grep -Eq '^(200|301|302|304)$'; then
                bad_urls=$((bad_urls + 1))
                if [ "${bad_urls}" -le 20 ]; then
                  bad_details="${bad_details}\n- ${page_url} -> ${code}"
                fi
              fi
            done < "${sitemap_urls_tmp}.all"
          fi

          status="OK"
          actions=""
          if [ -z "${edge_status}" ] || [ "${edge_status}" = "000" ] || [ "${edge_status}" -ge 500 ]; then
            status="CRITICAL"
            actions="${actions}\n- Site edge availability is failing; investigate Cloudflare/GitHub Pages edge."
          fi
          if [ "${edge_state}" = "error" ] || [ "${edge_state}" = "expired" ] || [ "${edge_state}" = "critical" ]; then
            status="CRITICAL"
            actions="${actions}\n- Renew/fix edge certificate immediately."
          elif [ "${edge_state}" = "warning" ]; then
            [ "${status}" = "OK" ] && status="WARN"
            actions="${actions}\n- Edge certificate expires within ${ALERT_DAYS} days."
          fi
          if [ "${ENFORCE_ORIGIN_VALIDATION}" = "true" ] && { [ "${origin_state}" = "error" ] || [ "${origin_state}" = "expired" ] || [ "${origin_state}" = "critical" ]; }; then
            status="CRITICAL"
            actions="${actions}\n- Origin certificate is ${origin_state} while strict origin validation is enabled."
          elif [ "${origin_state}" = "error" ] || [ "${origin_state}" = "expired" ] || [ "${origin_state}" = "critical" ] || [ "${origin_state}" = "warning" ]; then
            [ "${status}" = "OK" ] && status="WARN"
            actions="${actions}\n- Origin certificate is ${origin_state}; keep Cloudflare Full temporarily and switch back to Full (Strict) after renewal."
          fi
          if [ "${ENFORCE_ORIGIN_VALIDATION}" = "false" ] && [ "${origin_state}" = "healthy" ]; then
            [ "${status}" = "OK" ] && status="WARN"
            actions="${actions}\n- Certificates are healthy; switch Cloudflare to Full (Strict) and set ENFORCE_ORIGIN_VALIDATION=true."
          fi
          if [ "${bad_urls}" -gt 0 ]; then
            [ "${status}" = "OK" ] && status="WARN"
            actions="${actions}\n- Fix non-OK URLs from sitemap crawl (${bad_urls} found)."
          fi
          if [ -n "${security_actions}" ]; then
            [ "${status}" = "OK" ] && status="WARN"
            actions="${actions}\n- Apply missing security controls:${security_actions}"
          fi
          if [ "${ns_ok}" != "true" ]; then
            [ "${status}" = "OK" ] && status="WARN"
            actions="${actions}\n- Nameserver drift detected; verify Cloudflare NS assignment."
          fi
          [ -z "${actions}" ] && actions="\n- No immediate action required."

          {
            echo "Static Site Daily Brief"
            echo "Generated: ${now_utc}"
            echo ""
            echo "Overall status: ${status}"
            echo ""
            echo "Action required"
            printf '%b\n' "${actions}"
            echo ""
            echo "Key signals"
            echo "- URL: ${URL}"
            echo "- HTTP status: ${edge_status}"
            echo "- TTFB (s): ${edge_ttfb}"
            echo "- Total time (s): ${edge_total}"
            echo "- Server: ${edge_server:-unknown}"
            echo "- CF-Ray: ${edge_cf_ray:-unknown}"
            echo ""
            echo "TLS"
            echo "- Edge cert: state=${edge_state}, days_left=${edge_days_left:-unknown}, not_after=${edge_not_after:-unknown}"
            echo "- Origin cert: state=${origin_state}, min_days_left=${origin_min_days_left:-unknown}, min_not_after=${origin_min_not_after:-unknown}"
            printf '%b\n' "${origin_details}"
            echo "- ENFORCE_ORIGIN_VALIDATION=${ENFORCE_ORIGIN_VALIDATION}"
            echo ""
            echo "Security controls"
            echo "- HSTS header: ${hsts:+present}${hsts:-missing}"
            echo "- CSP: $([ "${csp_ok}" = "true" ] && echo present || echo missing)"
            echo "- Frame protection: $([ "${frame_protection_ok}" = "true" ] && echo present || echo missing)"
            echo "- X-Content-Type-Options: ${xcto:+present}${xcto:-missing}"
            echo "- Referrer-Policy: $([ "${refpol_ok}" = "true" ] && echo present || echo missing)"
            echo ""
            echo "SEO + crawl"
            echo "- /robots.txt status: ${robots_status}"
            echo "- /sitemap-index.xml status: ${sitemap_index_status}"
            echo "- URLs checked from sitemap: ${checked_urls}"
            echo "- Non-OK URLs: ${bad_urls}"
            if [ "${bad_urls}" -gt 0 ]; then
              printf '%b\n' "${bad_details}"
            fi
            echo ""
            echo "Config snapshot"
            echo "- NS: ${dns_ns:-none}"
            echo "- A: ${dns_a:-none}"
            echo "- AAAA: ${dns_aaaa:-none}"
            echo "- www CNAME: ${dns_www_cname:-none}"
            echo "- CAA: ${dns_caa:-none}"
          } > "${report_file}"

          {
            echo "status=${status}"
            echo "report<<EOF"
            cat "${report_file}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

          cat "${report_file}"

      - name: Detect SMTP configuration
        id: smtp
        shell: bash
        env:
          ALERT_SMTP_SERVER: ${{ secrets.ALERT_SMTP_SERVER }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
          ALERT_EMAIL_FROM: ${{ secrets.ALERT_EMAIL_FROM }}
          ALERT_SMTP_USERNAME: ${{ secrets.ALERT_SMTP_USERNAME }}
          ALERT_SMTP_PASSWORD: ${{ secrets.ALERT_SMTP_PASSWORD }}
        run: |
          set -euo pipefail
          configured=true
          [ -z "${ALERT_SMTP_SERVER}" ] && configured=false
          [ -z "${ALERT_EMAIL_TO}" ] && configured=false
          [ -z "${ALERT_EMAIL_FROM}" ] && configured=false
          [ -z "${ALERT_SMTP_USERNAME}" ] && configured=false
          [ -z "${ALERT_SMTP_PASSWORD}" ] && configured=false
          echo "configured=${configured}" >> "$GITHUB_OUTPUT"

      - name: Send daily brief email
        if: steps.smtp.outputs.configured == 'true'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.ALERT_SMTP_SERVER }}
          server_port: ${{ secrets.ALERT_SMTP_PORT || '587' }}
          username: ${{ secrets.ALERT_SMTP_USERNAME }}
          password: ${{ secrets.ALERT_SMTP_PASSWORD }}
          secure: false
          subject: '[DAILY][${{ steps.brief.outputs.status }}] robertasrudys.com static site brief'
          to: ${{ secrets.ALERT_EMAIL_TO }}
          from: ${{ secrets.ALERT_EMAIL_FROM }}
          body: |
            ${{ steps.brief.outputs.report }}

            Workflow run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}

      - name: Warn if SMTP is not configured
        if: steps.smtp.outputs.configured != 'true'
        run: echo "SMTP secrets missing, skipped email delivery."

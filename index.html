        // Dark mode toggle functionality
        function toggleDarkMode() {
            const body = document.body;
            const isDarkMode = body.classList.toggle('dark-mode');
            
            // Save preference to localStorage
            localStorage.setItem('darkMode', isDarkMode ? 'enabled' : 'disabled');
            
            // Update button text
            updateDarkModeButton(isDarkMode);
        }
        
        function updateDarkModeButton(isDarkMode) {
            const button = document.querySelector('.dark-mode-toggle');
            if (button) {
                button.textContent = isDarkMode ? '☀️ Light Mode' : '🌙 Dark Mode';
            }
        }
        
        function wrapJobSections() {
            // Wrap job sections to prevent page breaks within them
            const container = document.querySelector('.container');
            const h3Elements = container.querySelectorAll('h3');
            
            h3Elements.forEach(function(h3) {
                // Skip if already wrapped
                if (h3.parentNode.classList.contains('job-section')) {
                    return;
                }
                
                // Create wrapper div
                const wrapper = document.createElement('div');
                wrapper.className = 'job-section';
                
                // Insert wrapper before h3
                h3.parentNode.insertBefore(wrapper, h3);
                
                // Move h3 into wrapper
                wrapper.appendChild(h3);
                
                // Move all following siblings until next h3 or hr
                let nextElement = wrapper.nextSibling;
                while (nextElement && nextElement.tagName !== 'H3' && nextElement.tagName !== 'HR' && nextElement.tagName !== 'H2') {
                    const current = nextElement;
                    nextElement = nextElement.nextSibling;
                    wrapper.appendChild(current);
                }
            });
        }

        // Initialize on page load
        document.addEventListener('DOMContentLoaded', function() {
            // Check localStorage for saved preferences
            const darkModePreference = localStorage.getItem('darkMode');
            const isDarkMode = darkModePreference === 'enabled';
            
            if (isDarkMode) {
                document.body.classList.add('dark-mode');
            }
            
            updateDarkModeButton(isDarkMode);
            
            // Load saved CV version or default to backend
            const savedCVVersion = localStorage.getItem('cvVersion') || 'backend';
            document.getElementById('cvVersionSelect').value = savedCVVersion;
            loadCVContent(savedCVVersion);
            updatePageMeta(savedCVVersion);
        });
    </script>
